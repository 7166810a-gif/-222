name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK download
        run: cp app/build/outputs/apk/debug/app-debug.apk WiFiControl.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-control-debug-apk
          path: WiFiControl.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct GitHub release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifi-control-${{ github.run_number }}
          name: WiFi Control build ${{ github.run_number }}
          files: WiFiControl.apk
          fail_on_unmatched_files: true
          make_latest: true
